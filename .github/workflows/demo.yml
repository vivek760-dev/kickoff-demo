name: Demo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Smoke test app boots and /health responds
        run: |
          python - <<'EOF'
          from app import app
          client = app.test_client()
          res = client.get("/health")
          assert res.status_code == 200, res.status_code
          assert res.get_json()["status"] == "ok"
          print("health check passed")
          EOF

      - name: Docker build
        run: docker build -t kickoff-demo:ci .

      - name: Docker run + health check
        run: |
          docker rm -f kickoff-demo-ci 2>/dev/null || true
          docker run -d -p 8080:8080 --name kickoff-demo-ci kickoff-demo:ci
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/health; then
              echo "container healthy"
              exit 0
            fi
            sleep 2
          done
          echo "health check failed"
          docker logs kickoff-demo-ci
          exit 1

      - name: Cleanup CI container
        if: always()
        run: docker rm -f kickoff-demo-ci 2>/dev/null || true

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Write .env
        run: |
          echo "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}" > .env
          echo "URL_PREFIX=/demo" >> .env

      - name: Build production image
        run: docker build -t kickoff-demo:latest .

      - name: Stop old container
        run: docker rm -f kickoff-demo 2>/dev/null || true

      - name: Run new container
        run: |
          docker run -d -p 8080:8080 --env-file .env \
            --name kickoff-demo --restart unless-stopped kickoff-demo:latest

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/health; then
              echo "deploy healthy"
              exit 0
            fi
            sleep 2
          done
          echo "deploy health check failed"
          docker logs kickoff-demo
          exit 1
